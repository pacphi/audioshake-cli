name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"

jobs:
  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## AudioShake CLI ${{ github.ref_name }}

            ### Changes

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            **Via Cargo:**
            ```bash
            cargo install audioshake-cli
            ```

            **Via Binary:**
            Download the appropriate binary for your platform from the assets below.

            ### Supported Platforms

            | Platform | Architecture | Binary |
            |----------|--------------|--------|
            | Linux | x86_64 | `audioshake-linux-amd64.tar.gz` |
            | macOS | Intel | `audioshake-darwin-amd64.tar.gz` |
            | macOS | Apple Silicon | `audioshake-darwin-arm64.tar.gz` |
            | Windows | x86_64 | `audioshake-windows-amd64.zip` |

          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Build and Upload Release Binaries
  # ============================================
  build-binaries:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64
            archive: zip
            extension: .exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-release-${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/audioshake release/
          cp README.md LICENSE release/ 2>/dev/null || true
          cd release
          tar -czvf audioshake-${{ needs.create-release.outputs.version }}-${{ matrix.suffix }}.tar.gz *

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "target/${{ matrix.target }}/release/audioshake.exe" -Destination release/
          Copy-Item README.md, LICENSE -Destination release/ -ErrorAction SilentlyContinue
          Compress-Archive -Path release/* -DestinationPath "release/audioshake-${{ needs.create-release.outputs.version }}-${{ matrix.suffix }}.zip"

      - name: Upload release artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: release/audioshake-${{ needs.create-release.outputs.version }}-${{ matrix.suffix }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: release/audioshake-${{ needs.create-release.outputs.version }}-${{ matrix.suffix }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Publish to crates.io (optional)
  # Skips publishing if CARGO_REGISTRY_TOKEN is not configured
  # ============================================
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries]

    steps:
      - uses: actions/checkout@v6

      - name: Check for registry token
        id: check_token
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::CARGO_REGISTRY_TOKEN not configured. Skipping crates.io publish."
          fi

      - name: Install Rust toolchain
        if: steps.check_token.outputs.has_token == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.check_token.outputs.has_token == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Verify package
        if: steps.check_token.outputs.has_token == 'true'
        run: cargo package --list

      - name: Dry run publish
        if: steps.check_token.outputs.has_token == 'true'
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: steps.check_token.outputs.has_token == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Skip notice
        if: steps.check_token.outputs.has_token != 'true'
        run: echo "Skipped crates.io publish - CARGO_REGISTRY_TOKEN not configured"

  # ============================================
  # Release Summary
  # ============================================
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries]
    if: always()

    steps:
      - name: Release Summary
        run: |
          echo "## Release ${{ github.ref_name }} Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Binaries | ${{ needs.build-binaries.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download binaries from the release assets above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If published to crates.io:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cargo install audioshake-cli" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
